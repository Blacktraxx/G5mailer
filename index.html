<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Suggest names</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0a0a0a;
    color: #ededed;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1.5rem;
  }
  .wrap { max-width: 380px; width: 100%; }
  .card {
    background: #141414;
    border-radius: 14px;
    border: 1px solid #262626;
    padding: 2rem 1.75rem;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  h1 {
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 1.5rem;
    text-align: center;
    color: #ffffff;
    letter-spacing: -0.01em;
  }
  label {
    font-size: 12px;
    color: #9a9a9a;
    display: block;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    border-radius: 8px;
    border: 1px solid #2e2e2e;
    background: #1c1c1c;
    color: #ededed;
    font-size: 14px;
    transition: border-color 0.15s ease;
  }
  input::placeholder { color: #5c5c5c; }
  input:focus {
    outline: none;
    border-color: #6b6b6b;
  }
  #err, #ok {
    font-size: 13px;
    min-height: 18px;
    margin: -6px 0 10px;
    text-align: center;
  }
  #err { color: #e5484d; }
  #ok { color: #4cc38a; }
  button {
    width: 100%;
    padding: 11px;
    border-radius: 8px;
    border: 1px solid #3a4a5c;
    background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%);
    color: #f4f6f8;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease, background 0.15s ease;
  }
  button:hover { opacity: 0.9; }
  button:disabled {
    opacity: 0.6;
    cursor: default;
    background: #4b5563;
    border-color: #4b5563;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Suggest two names</h1>

    <label for="name1">Name 1</label>
    <input type="text" id="name1" placeholder="e.g. Amara" />

    <label for="name2">Name 2</label>
    <input type="text" id="name2" placeholder="e.g. Kai" />

    <p id="err"></p>
    <p id="ok"></p>

    <button id="submit">Submit</button>
  </div>
</div>

<script>
  const btn = document.getElementById("submit");
  const err = document.getElementById("err");
  const ok = document.getElementById("ok");

  btn.addEventListener("click", async () => {
    const name1 = document.getElementById("name1").value.trim();
    const name2 = document.getElementById("name2").value.trim();
    err.textContent = "";
    ok.textContent = "";

    if (!name1 || !name2) {
      err.textContent = "Enter both names.";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Submitting...";

    try {
      const resp = await fetch("/api/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name1, name2 }),
      });
      const data = await resp.json();

      if (!resp.ok) {
        err.textContent = data.error || "Something went wrong.";
      } else {
        ok.textContent = "Thanks! Your suggestion was sent.";
        document.getElementById("name1").value = "";
        document.getElementById("name2").value = "";
      }
    } catch (e) {
      err.textContent = "Network error. Try again.";
    } finally {
      btn.disabled = false;
      btn.textContent = "Submit";
    }
  });
</script>
</body>
</html>
